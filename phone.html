<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="歌词输入"/>
<title>手机输入 · Shan 歌词工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-2:#f8f9fb;--surface-3:#eff1f4;--border:#e4e7ec;--border-2:#d3d8df;
  --text:#14171f;--text-2:#525a68;--text-3:#8a919e;
  --accent:#4f5bd5;--accent-soft:#eef0fc;--accent-ring:rgba(79,91,213,.22);
  --ok:#16834a;--ok-soft:#e6f5ec;--bad:#d23f31;--bad-soft:#fdeeec;--warn:#a26000;--warn-soft:#fff4d9;
  --c-uni:#0e9fb5;--c-pretty:#7b5ce6;--c-trans:#d99a00;--c-trans2:#2f9e55;--c-trans3:#de4f74;--c-trans4:#2b7fd9;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
  --font-my:"Noto Sans Myanmar","Myanmar Text","Myanmar MN","Padauk",var(--font);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1015;--surface:#161920;--surface-2:#1b1f27;--surface-3:#232833;--border:#2a2f3a;--border-2:#3a404d;
  --text:#e9ebef;--text-2:#a8afbb;--text-3:#727a88;
  --accent:#8794ff;--accent-soft:rgba(135,148,255,.14);--accent-ring:rgba(135,148,255,.3);
  --ok:#4cc883;--ok-soft:rgba(76,200,131,.14);--bad:#ff7b6e;--bad-soft:rgba(255,123,110,.13);--warn:#f2b552;--warn-soft:rgba(242,181,82,.13);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 28px}

/* 配对页 */
.pair{display:grid;gap:18px;padding-top:9vh}
.pair h1{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.3px}
.pair p{margin:0;color:var(--text-2);font-size:15px;line-height:1.65}
.code-input{width:100%;height:64px;padding:0 16px;border:1.5px solid var(--border-2);border-radius:14px;background:var(--surface);font:600 30px/1 ui-monospace,Menlo,monospace;letter-spacing:.32em;text-align:center;text-transform:lowercase;outline:none}
.code-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-ring)}
.big-btn{height:54px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:650}
@media (prefers-color-scheme:dark){.big-btn{color:#0e1015}}
.pair small{color:var(--text-3);font-size:13px;line-height:1.6}

/* 顶部 */
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.conn{display:inline-flex;align-items:center;gap:7px;min-width:0;font-size:13px;color:var(--text-2)}
.conn i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--text-3)}
.conn.ok i{background:var(--ok)}.conn.wait i{background:var(--accent);animation:pulse 1s infinite}.conn.bad i{background:var(--bad)}
.conn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{opacity:.3}}
.top .sp{flex:1}
.ghost{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px;color:var(--text-2)}
.notice{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--text);font-size:14px;line-height:1.55}

/* 栏目切换 */
.cols{display:flex;gap:6px;margin:10px -14px 0;padding:2px 14px 4px;overflow-x:auto;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{display:inline-flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:14px;color:var(--text-2);white-space:nowrap}
.col i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col small{color:var(--text-3);font-size:12px}
.col.on{border-color:var(--c);color:var(--text);font-weight:650;box-shadow:inset 0 0 0 1px var(--c)}

/* 当前行 */
.meta{display:flex;align-items:baseline;gap:10px;margin:14px 2px 6px;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.meta b{color:var(--text);font-size:15px}
.meta .left{margin-left:auto}
.meta .left.done{color:var(--ok)}
.ref{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
.ctx{font-family:var(--font-my);font-size:14px;line-height:1.6;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.6em}
.main-ref{margin:4px 0;display:grid;gap:4px}
.main-ref div{font-size:21px;line-height:1.55;font-weight:600;overflow-wrap:anywhere}
.main-ref div.my{font-family:var(--font-my)}
.main-ref div small{display:block;font:500 12px/1.4 var(--font);color:var(--text-3)}
.main-ref .empty{color:var(--text-3);font-weight:400;font-size:15px}

/* 输入框 */
.edit{position:relative;margin-top:10px}
.edit label{display:flex;align-items:center;gap:7px;margin:0 2px 6px;font-size:13px;color:var(--text-2)}
.edit label i{width:8px;height:8px;border-radius:50%;background:var(--c)}
textarea{display:block;width:100%;min-height:96px;max-height:40vh;padding:12px 14px;border:1.5px solid var(--c,var(--border-2));border-radius:16px;background:var(--surface);font:19px/1.55 var(--font);outline:none;resize:none}
textarea.my{font-family:var(--font-my);font-size:20px}
textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--accent)) 22%,transparent)}
textarea:disabled{opacity:.5}

/* 操作 */
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.act{height:48px;border:1px solid var(--border);border-radius:13px;background:var(--surface);font-size:15px;font-weight:550;color:var(--text)}
.act:active{background:var(--surface-3)}
.act:disabled{opacity:.4}
.act.next{grid-column:1/-1;border:0;background:var(--accent);color:#fff;font-weight:650}
@media (prefers-color-scheme:dark){.act.next{color:#0e1015}}
.foot{display:flex;gap:8px;margin-top:8px}
.foot .act{flex:1;height:42px;font-size:14px;color:var(--text-2)}
.hint{margin:16px 2px 0;color:var(--text-3);font-size:12.5px;line-height:1.7}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-8px);opacity:0;z-index:10;max-width:calc(100% - 28px);padding:10px 16px;border-radius:12px;background:#1b1e26;color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.conn.wait i{transition:none;animation:none}}
</style>
</head>
<body>
<div class="wrap">

<section class="pair" id="pairView" hidden>
  <h1>📱 手机输入</h1>
  <p>在电脑上的 Shan 歌词工作台点「📱 手机输入」，用相机扫二维码就会自动连上；也可以在这里输入电脑上显示的配对码。</p>
  <input id="codeInput" class="code-input" inputmode="latin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="6" placeholder="······"/>
  <button class="big-btn" id="btnPair">连接</button>
  <small>连上以后，手机上打的字会实时填进电脑上正在编辑的格子。手机和电脑都要能上网；不需要在同一个 Wi-Fi。</small>
</section>

<section id="workView" hidden>
  <div class="top">
    <span class="conn wait" id="conn"><i></i><span id="connText">正在连接电脑…</span></span>
    <span class="sp"></span>
    <button class="ghost" id="btnUndo" title="撤销电脑上的最近一次修改">↶ 撤销</button>
  </div>
  <div class="notice" id="notice" hidden></div>

  <div class="cols" id="cols"></div>

  <div class="meta"><b id="pos">—</b><span id="time"></span><span class="left" id="left"></span></div>
  <div class="ref">
    <div class="ctx" id="prevLine"></div>
    <div class="main-ref" id="mainRef"></div>
    <div class="ctx" id="nextLine"></div>
  </div>

  <div class="edit" id="edit">
    <label for="ta"><i></i><span id="taLabel">输入</span></label>
    <textarea id="ta" rows="2" enterkeyhint="next" autocomplete="off" spellcheck="false" disabled placeholder="等待电脑…"></textarea>
  </div>

  <div class="acts">
    <button class="act" data-nav="prev">↑ 上一行</button>
    <button class="act" id="btnPlay">▶ 播放</button>
    <button class="act" data-nav="next">↓ 下一行</button>
    <button class="act next" data-nav="empty">跳到下一个空白格</button>
  </div>
  <div class="foot">
    <button class="act" id="btnRedo">↷ 重做</button>
    <button class="act" id="btnUnpair">换配对码</button>
  </div>
  <p class="hint">键盘上的 next / return 键 = 下一行。用键盘上的 🎤 听写也可以直接输入。播放的是电脑上的音频。</p>
</section>

</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PREFIX='shanlrc-',CODE_KEY='shan-phone-last-code';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}},del:k=>{try{localStorage.removeItem(k)}catch(_){}}};
const COLORS={uni:'var(--c-uni)',pretty:'var(--c-pretty)',trans:'var(--c-trans)',trans2:'var(--c-trans2)',trans3:'var(--c-trans3)',trans4:'var(--c-trans4)'};
const S={peer:null,conn:null,code:'',want:false,seq:0,cell:'',state:null,composing:false,retryT:null};
const ta=$('ta');
const cleanCode=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6);

let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function setConn(kind,text){$('conn').className='conn '+kind;$('connText').textContent=text;ta.disabled=kind!=='ok'||!S.state;}
function setNotice(text){$('notice').hidden=!text;$('notice').textContent=text||'';}

/* ---------- 连接 ---------- */
function connect(code){
  code=cleanCode(code);if(code.length<4){toast('请输入电脑上显示的配对码');return;}
  S.code=code;S.want=true;ls.set(CODE_KEY,code);
  try{history.replaceState(null,'','#k='+code);}catch(_){}
  $('pairView').hidden=true;$('workView').hidden=false;
  setConn('wait','正在连接电脑…');setNotice('');
  if(typeof Peer==='undefined'){setConn('bad','连接组件没有载入');setNotice('请检查手机网络后刷新页面。');return;}
  if(!S.peer||S.peer.destroyed){
    const peer=new Peer({debug:0});S.peer=peer;
    peer.on('open',()=>{if(S.peer===peer)openConn();});
    peer.on('disconnected',()=>{if(S.peer===peer&&S.want&&!peer.destroyed)setTimeout(()=>{try{if(peer.disconnected&&!peer.destroyed)peer.reconnect();}catch(_){}},1500);});
    peer.on('error',err=>{
      if(S.peer!==peer)return;
      if(err.type==='peer-unavailable'){setConn('bad','找不到电脑');setNotice(`请确认电脑上的歌词工作台开着「📱 手机输入」，配对码是 ${S.code}。会自动重试。`);retry(4000);}
      else if(['network','server-error','socket-error','socket-closed'].includes(err.type)){setConn('bad','网络不稳定，正在重试…');retry(4000);}
      else{setConn('bad','连接出错，正在重试…');retry(5000);}
    });
  }else if(S.peer.open)openConn();
}
function openConn(){
  if(S.conn){try{S.conn.close();}catch(_){}}
  const c=S.peer.connect(PREFIX+S.code,{serialization:'json',reliable:true});S.conn=c;
  c.on('open',()=>{if(S.conn!==c)return;S.bye=false;setNotice('');setConn('ok','已连接电脑');send({t:'hello',v:1});});
  c.on('data',d=>{if(S.conn===c)onData(d);});
  c.on('close',()=>{if(S.conn!==c)return;S.conn=null;if(S.bye){setConn('bad','电脑已停止手机输入');retry(5000);return;}setConn('bad','连接断开，正在重连…');retry(2000);});
  c.on('error',()=>{});
}
function retry(ms){
  clearTimeout(S.retryT);if(!S.want)return;
  S.retryT=setTimeout(()=>{
    if(!S.want||(S.conn&&S.conn.open))return;
    if(!S.peer||S.peer.destroyed){S.peer=null;connect(S.code);return;}
    if(S.peer.disconnected){try{S.peer.reconnect();}catch(_){}retry(ms);return;}
    openConn();
  },ms);
}
function send(m){if(S.conn&&S.conn.open){try{S.conn.send(m);}catch(_){}}}
// 手机锁屏 / 切到别的 App 再回来时，连接可能已经断了
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.want&&!(S.conn&&S.conn.open))retry(50);});

/* ---------- 显示 ---------- */
function onData(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='state')renderState(d);
  else if(d.t==='toast')toast(d.msg);
  else if(d.t==='bye'){S.bye=true;setConn('bad','电脑已停止手机输入');setNotice('电脑上重新打开「📱 手机输入」后，这里会自动连回去。');}
}
function renderState(d){
  S.state=d;const key=d.id+'|'+d.col,cur=d.cols.find(c=>c.key===d.col)||{label:d.col};
  const atEnd=ta.selectionStart===ta.value.length;
  if(key!==S.cell){S.cell=key;ta.value=d.value||'';moveCaretEnd();}
  // 只有手机这边的输入都被电脑收到后，才接受电脑那边的内容（避免打字时被旧内容盖掉）
  else if(d.ack>=S.seq&&!S.composing&&ta.value!==(d.value||'')){ta.value=d.value||'';if(atEnd)moveCaretEnd();}
  ta.disabled=!(S.conn&&S.conn.open);
  ta.classList.toggle('my',!!cur.my);
  const color=COLORS[d.col]||'var(--accent)';$('edit').style.setProperty('--c',color);
  $('taLabel').textContent=cur.label+(cur.lang?` · ${cur.lang}`:'');
  ta.placeholder=`输入${cur.label}…`;
  $('cols').innerHTML=d.cols.map(c=>`<button class="col${c.key===d.col?' on':''}" data-col="${c.key}" style="--c:${COLORS[c.key]||'var(--accent)'}"><i></i>${esc(c.label)}${c.lang?`<small>${esc(c.lang)}</small>`:''}</button>`).join('');
  $('cols').querySelector('.on')?.scrollIntoView({block:'nearest',inline:'nearest'});
  $('pos').textContent=`第 ${d.i+1} / ${d.total} 行`;$('time').textContent=d.time||'';
  const left=$('left');left.textContent=d.emptyLeft?`还有 ${d.emptyLeft} 格空白`:'这一栏都填好了';left.classList.toggle('done',!d.emptyLeft);
  $('prevLine').textContent=d.prev||'';$('nextLine').textContent=d.next||'';
  $('mainRef').innerHTML=(d.refs&&d.refs.length?d.refs:[]).map(r=>`<div class="${r.my?'my':''}"><small>${esc(r.label)}</small>${r.text?esc(r.text):'<span class="empty">（空）</span>'}</div>`).join('')||'<div class="empty">正在编辑原文</div>';
  document.querySelectorAll('[data-nav=prev]').forEach(b=>b.disabled=d.i<=0);
  $('btnPlay').disabled=!d.audio;
  autosize();
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function moveCaretEnd(){const L=ta.value.length;try{ta.setSelectionRange(L,L);}catch(_){}}
function autosize(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight+3,window.innerHeight*.4)+'px';}

/* ---------- 输入 ---------- */
function sendValue(){
  if(!S.state)return;
  const v=ta.value.replace(/\r?\n/g,' ');if(v!==ta.value){ta.value=v;moveCaretEnd();}
  S.seq++;send({t:'input',seq:S.seq,id:S.state.id,col:S.state.col,value:v});autosize();
}
ta.addEventListener('compositionstart',()=>{S.composing=true;});
ta.addEventListener('compositionend',()=>{S.composing=false;sendValue();});
// 拼音等输入法选字过程中不发送，选完字再发
ta.addEventListener('input',e=>{if(e.isComposing||S.composing)return;sendValue();});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();nav('next');}});
function nav(dir){if(S.composing){S.composing=false;sendValue();}send({t:'nav',dir});}

// 按按钮时不让输入框失去焦点，键盘就不会收起
document.querySelectorAll('.acts .act,.cols').forEach(b=>b.addEventListener('pointerdown',e=>{if(document.activeElement===ta)e.preventDefault();}));
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));
$('cols').addEventListener('click',e=>{const b=e.target.closest('[data-col]');if(b)send({t:'col',key:b.dataset.col});});
$('btnPlay').onclick=()=>send({t:'play'});
$('btnUndo').onclick=()=>send({t:'undo'});
$('btnRedo').onclick=()=>send({t:'redo'});
$('btnUnpair').onclick=()=>{
  S.want=false;clearTimeout(S.retryT);try{S.conn&&S.conn.close();}catch(_){}try{S.peer&&S.peer.destroy();}catch(_){}
  S.peer=null;S.conn=null;S.state=null;S.cell='';ls.del(CODE_KEY);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}
  showPair();
};
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(document.activeElement===ta)$('edit').scrollIntoView({block:'nearest'});});

/* ---------- 配对 ---------- */
function showPair(){$('workView').hidden=true;$('pairView').hidden=false;const c=$('codeInput');c.value='';setTimeout(()=>c.focus(),50);}
$('btnPair').onclick=()=>connect($('codeInput').value);
$('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();connect($('codeInput').value);}});
$('codeInput').addEventListener('input',e=>{const v=cleanCode(e.target.value);if(v!==e.target.value)e.target.value=v;});

const fromHash=cleanCode(new URLSearchParams(location.hash.slice(1)).get('k'));
const start=fromHash||cleanCode(ls.get(CODE_KEY));
if(start)connect(start);else showPair();
</script>
</body>
</html>
